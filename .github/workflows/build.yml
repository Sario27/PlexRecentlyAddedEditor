name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish self-contained exe
        run: >
          dotnet publish src/PlexRecentlyAddedEditor/PlexRecentlyAddedEditor.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexRecentlyAddedEditor-win-x64
          path: publish/PlexRecentlyAddedEditor.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PlexRecentlyAddedEditor-win-x64
          path: publish

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/PlexRecentlyAddedEditor.exe
          generate_release_notes: true
