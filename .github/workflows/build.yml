name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish self-contained exe
        run: >
          dotnet publish src/PlexRecentlyAddedEditor/PlexRecentlyAddedEditor.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: PlexRecentlyAddedEditor-win-x64
          path: publish/PlexRecentlyAddedEditor.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PlexRecentlyAddedEditor-win-x64
          path: publish

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: publish/PlexRecentlyAddedEditor.exe
          generate_release_notes: true

      - name: Scan release exe with VirusTotal
        id: virustotal
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: false
          files: |
            publish/PlexRecentlyAddedEditor.exe

      # update_release_body above only works when the action runs off a native GitHub
      # "release published" event; we trigger off a tag push instead, so it silently
      # no-ops. Append the scan link ourselves so it actually lands every time.
      - name: Append VirusTotal link to release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VT_URL="${{ steps.virustotal.outputs.analysis }}"
          VT_URL="${VT_URL#*=}"
          CURRENT_BODY=$(gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json body -q .body)
          printf '%s\n\n---\n\n**VirusTotal scan of PlexRecentlyAddedEditor.exe:** %s\n' "$CURRENT_BODY" "$VT_URL" \
            | gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file -
